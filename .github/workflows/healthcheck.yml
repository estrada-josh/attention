# Daily healthcheck: site alive, bridge alive, follower/star counts -> metrics.csv.
# Opens one issue after two consecutive failing days. Re-enables the publish schedule
# (GitHub disables schedules after 60 days without repo activity).
name: healthcheck
on:
  schedule:
    - cron: '30 14 * * *'   # 10:30 AM EDT / 9:30 AM EST
  workflow_dispatch: {}
concurrency:
  group: attention-publish
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.11" }
      - run: uv sync --frozen --no-dev
      - name: Check every audience
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for a in $(ls audiences); do
            [ -f "audiences/$a/audience.yml" ] || continue
            uv run python -m engine.healthcheck --audience "$a" || echo "healthcheck $a reported problems"
          done
      - name: Keep schedules alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable publish.yml || true
      - name: Commit metrics
        run: |
          set -euo pipefail
          git config user.name "attention-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A audiences/*/data
          git diff --cached --quiet && exit 0
          git commit -m "chore(metrics): daily healthcheck" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 10; done
