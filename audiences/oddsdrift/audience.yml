# OddsDrift — the first audience run by the attention engine.
# Copy this folder to start a new audience: change names, domain, sources, shapes, channels.
display_name: "OddsDrift (bot)"
domain: odds-drift.com
site_url: https://odds-drift.com
description: "Automated tracker of prediction-market odds: the biggest 24h swings, upsets at settlement, a daily midterms board, and a weekly calibration scorecard. Data from the public Kalshi and Polymarket APIs. Not affiliated. Not investment advice."
contact_email: oddsdrift@agentmail.to
repo: estrada-josh/attention
site_root: audiences/oddsdrift/site
tags: [PredictionMarkets]
bluesky_handle: odds-drift.com                # custom handle via Bridgy Fed web bridge
nostr_pubkey_hex: c09cf90d14c41c2503647a7b85a31646daafb269a43ab9305361df8e99041d47   # npub1czw0jrg5cswz2qmy0factgckgmd2lvnf5satjvznv80caxgyr4rs39ht27

sources:
  - type: kalshi
    note: "public REST API, no key; multivariate parlay legs excluded (mve_filter=exclude)"
    max_pages: 150                  # ~80 pages of open markets today; the cap logs a warning
  - type: polymarket
    note: "public Gamma API, no key; top ~2,100 markets by 24h volume (API offset cap); watchlist markets are fetched by slug"
    settled_volume_min: 10000       # server-side floor on the settled scan; matches settled_min_volume

thresholds:
  exclude_categories: [Sports]        # in-game props dominate volume; keep the feed about the world
  exclude_title_regex: "Up or Down|Higher or Lower|price up in next|next \\d+ mins|\\b(CS2|Dota|LoL|Valorant|esports|EWC)\\b|\\bvs\\.?\\b"
  min_hours_to_close: 12              # skip markets about to resolve (already-decided noise)
  movers_min_points: 8
  movers_top_n: 4
  movers_min_rows: 2
  min_volume_24h: { kalshi: 5000, polymarket: 10000 }
  min_volume_24h_default: 5000
  settled_min_volume: 10000
  settled_top_n: 4
  upset_yes_max_price: 0.15
  upset_no_min_price: 0.85
  venue_tags: { kalshi: Kalshi, polymarket: Polymarket }
  store_exclude_categories: [Sports]  # never stored: keeps the git repo small; sports is not the feed's topic
  snapshot_min_volume_24h: 250      # rows kept per snapshot (24h reference prices)
  snapshot_min_open_interest: 1500
  resolution_min_volume_24h: 100
  settled_min_lifetime_hours: 30      # a 15-minute market has no price 24h before it settled
  snapshot_keep_days: 45
  slot_grace_minutes: 240             # how late a cron tick may be and still post the slot
  breaker_failures: 3
  breaker_cooldown_hours: 12          # after this the breaker goes half-open and retries

shapes:
  - { slot: am, type: movers, at: "13:17" }                       # 9:17 AM EDT / 8:17 AM EST
  - { slot: pm, type: settled, at: "22:17" }                      # 6:17 PM EDT / 5:17 PM EST
  - slot: board
    type: watchlist
    at: "17:17"                                                   # 1:17 PM EDT / 12:17 PM EST
    days: [0, 1, 2, 3, 4, 5]                                      # Mon-Sat
    until: "2026-11-03"
    headline: "Midterms 2026 odds board"
    countdown_to: "2026-11-03"
    countdown_label: "Election Day"
    tags: [Midterms2026, PredictionMarkets]
    min_found: 2
    watch:
      - name: "Senate (D)"
        match:
          - { venue: kalshi, ticker: CONTROLS-2026-D }
          - { venue: polymarket, ticker: will-the-democratic-party-control-the-senate-after-the-2026-midterm-elections }
      - name: "House (D)"
        match:
          - { venue: kalshi, ticker: CONTROLH-2026-D }
          - { venue: polymarket, ticker: will-the-democratic-party-control-the-house-after-the-2026-midterm-elections }
      - name: "TX Sen (D)"
        match:
          - { venue: kalshi, ticker: SENATETX-26-D }
          - { venue: polymarket, ticker: will-the-democrats-win-the-texas-senate-race-in-2026 }
      - name: "MI Sen (D)"
        match:
          - { venue: kalshi, ticker: SENATEMI-26-D }
          - { venue: polymarket, ticker: will-the-democrats-win-the-michigan-senate-race-in-2026 }
      - name: "OH Sen (D)"
        match:
          - { venue: kalshi, ticker: SENATEOHS-26-D }
          - { venue: polymarket, ticker: will-the-democrats-win-the-ohio-senate-race-in-2026 }
      - name: "GA Sen (D)"
        match:
          - { venue: kalshi, ticker: SENATEGA-26-D }
          - { venue: polymarket, ticker: will-the-democrats-win-the-georgia-senate-race-in-2026 }
      - name: "ME Sen (D)"
        match:
          - { venue: kalshi, ticker: SENATEME-26-D }
          - { venue: polymarket, ticker: will-the-democrats-win-the-maine-senate-race-in-2026 }
  - { slot: sunday, type: scorecard, at: "15:17", days: [6], window_days: 7, min_resolved: 20 }

channels:
  - { type: bridgy }                     # -> Bluesky + fediverse via fed.brid.gy web-site bridge
  - { type: nostr, relays: ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net"] }
  - { type: mastodon, enabled: false }   # turn on when MASTODON_INSTANCE/MASTODON_TOKEN exist

follow_links:
  - { label: "Bluesky", href: "https://bsky.app/profile/odds-drift.com" }
  - { label: "Fediverse", href: "https://fed.brid.gy/web/odds-drift.com" }
  - { label: "RSS", href: "https://odds-drift.com/feed.xml" }
  - { label: "GitHub", href: "https://github.com/estrada-josh/attention" }
  - { label: "Nostr", href: "https://njump.me/npub1czw0jrg5cswz2qmy0factgckgmd2lvnf5satjvznv80caxgyr4rs39ht27" }
healthcheck:
  max_post_age_hours: 30              # slots run daily; older than this means the feed stopped
  max_run_age_hours: 30

nav_links:
  - { label: "Calibration", href: "/calibration" }
